<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organizador de Tareas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-board="trabajo">
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✓</span>
      <span class="brand-name">Organizador</span>
    </div>
    <nav class="board-tabs" role="tablist" aria-label="Tablones">
      <button class="board-tab" role="tab" data-board="trabajo" aria-selected="true">💼 Trabajo</button>
      <button class="board-tab" role="tab" data-board="personal" aria-selected="false">🏡 Personal</button>
    </nav>
    <div class="header-actions">
      <button class="btn btn-ghost" id="btn-members" type="button">👥 <span id="members-label">Equipo</span></button>
    </div>
  </header>

  <main class="app-main">
    <section class="board-head">
      <div>
        <h1 id="board-title">Trabajo</h1>
        <p class="board-summary" id="board-summary"></p>
      </div>
      <button class="btn btn-primary" id="btn-new-task" type="button">+ Nueva tarea</button>
    </section>

    <section class="toolbar" aria-label="Filtros">
      <div class="segmented" id="scope-filter" role="group" aria-label="Ver tareas de">
        <button type="button" data-scope="mine">Mis tareas</button>
        <button type="button" data-scope="team">Del equipo</button>
        <button type="button" data-scope="all">Todas</button>
      </div>
      <label class="field-inline">
        <span>Persona</span>
        <select id="member-filter"></select>
      </label>
      <label class="field-inline">
        <span>Prioridad</span>
        <select id="priority-filter">
          <option value="">Todas</option>
          <option value="alta">Alta</option>
          <option value="media">Media</option>
          <option value="baja">Baja</option>
        </select>
      </label>
      <input type="search" id="search" placeholder="Buscar tareas…" aria-label="Buscar tareas">
      <div class="segmented" id="view-switch" role="group" aria-label="Vista">
        <button type="button" data-view="kanban">Tablero</button>
        <button type="button" data-view="people">Por persona</button>
      </div>
    </section>

    <section id="kanban" class="kanban" aria-label="Tablero de tareas"></section>
    <section id="people" class="people" aria-label="Tareas por persona" hidden></section>
  </main>

  <!-- Modal de tarea -->
  <dialog id="task-dialog" class="dialog">
    <form id="task-form" method="dialog">
      <h2 id="task-dialog-title">Nueva tarea</h2>
      <label class="field">
        <span>Título</span>
        <input name="title" required maxlength="140" autocomplete="off">
      </label>
      <label class="field">
        <span>Descripción</span>
        <textarea name="description" rows="3"></textarea>
      </label>
      <div class="field-row">
        <label class="field">
          <span>Asignada a</span>
          <select name="assigneeId"></select>
        </label>
        <label class="field">
          <span>Estado</span>
          <select name="status"></select>
        </label>
      </div>
      <div class="field-row">
        <label class="field">
          <span>Prioridad</span>
          <select name="priority">
            <option value="alta">Alta</option>
            <option value="media">Media</option>
            <option value="baja">Baja</option>
          </select>
        </label>
        <label class="field">
          <span>Fecha límite</span>
          <input type="date" name="dueDate">
        </label>
      </div>
      <label class="check-field" id="urgent-field">
        <input type="checkbox" name="urgent">
        <span>🔥 Más urgente <em>(se muestra a la derecha del bloque)</em></span>
      </label>
      <label class="field" id="blocked-reason-field" hidden>
        <span>Motivo del bloqueo <em>(opcional)</em></span>
        <textarea name="blockedReason" rows="2" placeholder="¿Qué impide avanzar con esta tarea?"></textarea>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn btn-danger" id="btn-delete-task">Eliminar</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Modal de miembros -->
  <dialog id="members-dialog" class="dialog">
    <form id="members-form" method="dialog">
      <h2 id="members-dialog-title">Equipo</h2>
      <p class="hint" id="members-hint"></p>
      <ul class="member-list" id="member-list"></ul>
      <div class="add-member">
        <input id="new-member-name" placeholder="Nombre de la persona" maxlength="40" autocomplete="off">
        <button type="button" class="btn btn-primary" id="btn-add-member">Añadir</button>
      </div>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close>Cerrar</button>
      </div>
    </form>
  </dialog>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
